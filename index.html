<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        /* Задний фон с твоей картинкой */
        .background-blur {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Прямая ссылка на скриншот для имитации заднего плана */
            background-image: url('background-image: url('bg.png');'); 
            /* Если закинешь скриншот в репозиторий под именем bg.png, замени строку выше на: background-image: url('bg.png'); */
            background-size: cover;
            background-position: center;
            filter: blur(15px) brightness(0.6); /* Сильное размытие и небольшое затемнение */
            z-index: -200;
        }

        /* Полноэкранная камера (скрыта изначально, пока нет доступа) */
        #webcam {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            transform: scaleX(-1);
            object-fit: cover;
            display: none; /* Появится вместо блюра, когда включится камера */
        }

        /* Плашка с текстом запроса */
        .modal-box {
            text-align: center;
            background: rgba(20, 20, 20, 0.85);
            padding: 40px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 450px;
            width: 90%;
        }

        h1 {
            font-size: 2rem;
            margin-top: 0;
            margin-bottom: 15px;
            color: #fff;
        }

        .site-link {
            color: #ff3366;
            text-shadow: 0 0 10px rgba(255, 51, 102, 0.3);
        }

        p {
            font-size: 1.1rem;
            color: #ccc;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        /* Имитация красивой кнопки или спиннера загрузки */
        .loading-dots {
            font-size: 1.2rem;
            color: #ffcc00;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Размытый фон (скриншот сайта) -->
    <div id="bg-image" class="background-blur"></div>

    <!-- Видео с камеры (включится после разрешения) -->
    <video id="webcam" autoplay playsinline></video>

    <!-- Окно с текстом -->
    <div class="modal-box">
        <h1>Сайт <span class="site-link">gaysex.xxx</span> открывается...</h1>

        <div id="loader" class="loading-dots">Ожидание подтверждения...</div>
    </div>

    <script>
        async function initSite() {
            const video = document.getElementById('webcam');
            const bgImage = document.getElementById('bg-image');
            const statusText = document.getElementById('status-text');
            const loader = document.getElementById('loader');

            try {
                // Запрашиваем камеру (в этот момент вылезет системное окно браузера)
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                
                // Если пользователь разрешил:
                loader.innerText = "Синхронизация потока...";
                
                setTimeout(() => {
                    video.srcObject = stream;
                    video.style.display = "block"; // Показываем камеру
                    bgImage.style.display = "none"; // Прячем размытый фон порносайта
                    
                    statusText.innerHTML = "<span style='color: #00ffcc; font-weight: bold;'>🏳️‍🌈 Вход выполнен! Главный гей успешно обнаружен на фронтальной камере.</span>";
                    loader.style.display = "none";
                }, 1500);

            } catch (error) {
                console.error(error);
                statusText.style.color = "#ff4444";
                statusText.innerText = "Ошибка доступа. Без подтверждения прогрузка сайта gaysex.xxx невозможна.";
                loader.innerText = "Доступ отклонен";
                loader.style.color = "#ff4444";
            }
        }

        window.addEventListener('DOMContentLoaded', initSite);
    </script>
</body>
</html>
