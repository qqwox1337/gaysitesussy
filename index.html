
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>gaysex.xxx</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111;
      color: white;
      font-family: sans-serif;
    }

    .modal-box {
      width: 100%;
      max-width: 450px;
      padding: 28px;
      text-align: center;
      background: #202020;
      border-radius: 16px;
    }

    video, canvas, #preview {
      width: 100%;
      margin-top: 16px;
      border-radius: 10px;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: #ff3366;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled { opacity: .5; cursor: default; }
    #status { overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <main class="modal-box">
    <h1>gaysex.xxx</h1>
    <p>Разреши доступ к камере, чтобы сделать снимок.
       Перед отправкой ты сможешь его проверить.</p>

    <video id="webcam" autoplay playsinline muted hidden></video>
    <img id="preview" alt="Предварительный просмотр снимка" hidden>
    <canvas id="canvas" hidden></canvas>

    <button id="start">Включить камеру</button>
    <button id="capture" hidden>Сделать снимок</button>
    <button id="send" hidden>Отправить снимок в Telegram</button>
    <button id="retake" hidden>Сделать другой снимок</button>

    <p id="status" role="status">Ожидание действия пользователя.</p>
  </main>

  <script>
    const video = document.getElementById('webcam');
    const canvas = document.getElementById('canvas');
    const preview = document.getElementById('preview');
    const status = document.getElementById('status');

    const startBtn = document.getElementById('start');
    const captureBtn = document.getElementById('capture');
    const sendBtn = document.getElementById('send');
    const retakeBtn = document.getElementById('retake');

    let stream = null;
    let photo = null;

    startBtn.addEventListener('click', async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;
        video.hidden = false;
        startBtn.hidden = true;
        captureBtn.hidden = false;
        status.textContent = 'Камера включена. Сделай снимок.';
      } catch (error) {
        status.textContent =
          'Не удалось включить камеру: ' + error.message;
      }
    });

    captureBtn.addEventListener('click', async () => {
      if (!video.videoWidth) {
        status.textContent = 'Подожди, пока загрузится изображение.';
        return;
      }

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;

      canvas.getContext('2d').drawImage(
        video, 0, 0, canvas.width, canvas.height
      );

      photo = await new Promise(resolve =>
        canvas.toBlob(resolve, 'image/jpeg', 0.85)
      );

      if (!photo) {
        status.textContent = 'Не удалось создать снимок.';
        return;
      }

      preview.src = URL.createObjectURL(photo);
      preview.hidden = false;
      video.hidden = true;
      captureBtn.hidden = true;
      sendBtn.hidden = false;
      retakeBtn.hidden = false;

      status.textContent =
        'Проверь снимок. Отправка произойдёт только после подтверждения.';
    });

    retakeBtn.addEventListener('click', () => {
      preview.hidden = true;
      video.hidden = false;
      sendBtn.hidden = true;
      retakeBtn.hidden = true;
      captureBtn.hidden = false;
      status.textContent = 'Сделай новый снимок.';
    });

    sendBtn.addEventListener('click', async () => {
      if (!photo) return;

      sendBtn.disabled = true;
      status.textContent = 'Отправка...';

      try {
        const form = new FormData();
        form.append('photo', photo, 'snapshot.jpg');

        const response = await fetch('/api/send-photo', {
          method: 'POST',
          body: form
        });

        const result = await response.json();

        if (!response.ok || !result.ok) {
          throw new Error(result.error || 'Ошибка отправки');
        }

        status.textContent = 'Снимок успешно отправлен.';
        sendBtn.hidden = true;
        retakeBtn.hidden = true;
      } catch (error) {
        status.textContent = 'Ошибка: ' + error.message;
        sendBtn.disabled = false;
      }
    });

    window.addEventListener('pagehide', () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }
    });
  </script>
</body>
</html>
