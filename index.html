<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Официальный сайт</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #111;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        /* Полноэкранная камера */
        #webcam {
            position: fixed;
            right: 0;
            bottom: 0;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            z-index: -100;
            transform: scaleX(-1);
            object-fit: cover;
            filter: saturate(1.2); /* Немного сочности цветам */
        }
        /* Радужная плашка */
        .card {
            text-align: center;
            background: rgba(0, 0, 0, 0.75);
            padding: 40px;
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 30px rgba(255, 0, 128, 0.5);
            border: 3px solid transparent;
            border-image: linear-gradient(to right, red, orange, yellow, green, blue, purple);
            border-image-slice: 1;
            max-width: 400px;
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff007f, #ff00ff, #00ffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p {
            font-size: 1.2rem;
            color: #ccc;
        }
        .status-searching {
            color: #ffcc00;
            font-weight: bold;
        }
        .status-found {
            color: #00ffcc;
            font-weight: bold;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
    </style>
</head>
<body>

    <video id="webcam" autoplay playsinline></video>

    <div class="card">
        <h1>Сканер обнаружен!</h1>
        <p id="status" class="status-searching">Поиск главного гея в этой комнате...</p>
    </div>

    <script>
        async function startScan() {
            const video = document.getElementById('webcam');
            const statusText = document.getElementById('status');

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = stream;
                
                // Имитация загрузки/сканирования
                setTimeout(() => {
                    statusText.className = "status-found";
                    statusText.innerText = "🏳️‍🌈 Объект успешно найден прямо по курсу!";
                }, 2000);

            } catch (error) {
                console.error(error);
                statusText.style.color = "#ff4444";
                statusText.innerText = "Ошибка: Чтобы сканер сработал, нужно разрешить доступ к камере.";
            }
        }

        window.addEventListener('DOMContentLoaded', startScan);
    </script>
</body>
</html>
